<script>
(function () {
  var v = document.getElementById('player');
  var overlay = document.getElementById('overlay');
  var label = document.getElementById('overlay-label');
  function show(text) {
    if (text) label.textContent = text;
    overlay.classList.add('show');
  }
  function hide() { overlay.classList.remove('show'); }
  async function tryPlayLoud() {
    v.muted = false;
    v.defaultMuted = false;
    await v.play();
  }
  async function start() {
    try {
      await tryPlayLoud();
      if (v.muted) show('הקישו להפעלת סאונד');
      else hide();
    } catch (e) {
      v.muted = true;
      v.defaultMuted = true;
      try {
        await v.play();
        show('הקישו להפעלת סאונד');
      } catch (e2) {
        show('הקישו לצפייה');
      }
    }
  }
  async function unmuteOrPlay() {
    v.muted = false;
    v.defaultMuted = false;
    try {
      await v.play();
      hide();
    } catch (e) {
      show('הקישו לצפייה');
    }
  }
  overlay.addEventListener('click', function (ev) { ev.preventDefault(); unmuteOrPlay(); });
  v.addEventListener('volumechange', function () { if (!v.muted && !v.paused) hide(); });
  v.addEventListener('play', function () { if (!v.muted) hide(); });
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
